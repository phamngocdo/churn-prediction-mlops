[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-mlops"
version = "0.1.0"
description = "End-to-end MLOps project: churn prediction with training, orchestration, deployment and monitoring"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Do Pham Ngoc", email = "ngocdo992k4@gmail.com" }
]


dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "python-dotenv==1.0.1",
    "mlflow==3.16.1",
    "kagglehub==1.0.2",

]

[project.optional-dependencies]
train = [
    "xgboost==2.1.0",
    "boto3==1.34.155",
]

api = [
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.5",
    "pyspark==4.2.0",
]

web = [
    "streamlit==1.56.0",
]

orchestration = [
    "prefect==2.20.2",
]

data = [
    "dvc-s3==3.3.0",
    "evidently==0.4.33",
]

dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.5.7",
    "pre-commit==3.8.0",
    "ipykernel==7.3.0",
]

# ---- setuptools: src-layout ----
[tool.setuptools.packages.find]
where = ["src"]
include = ["churn_mlops*"]

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=churn_mlops --cov-report=term-missing --cov-fail-under=75"
filterwarnings = [
    # Upstream warning from MLflow's internal Pydantic models (field name
    # "model_name" conflicts with Pydantic v2's protected "model_" namespace).
    # Not caused by our code, nothing we can fix on our side -- safe to ignore.
    'ignore:Field "model_name" has conflict with protected namespace:UserWarning',
    # Starlette 0.37's TestClient imports AnyIO's deprecated BlockingPortal alias.
    'ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead:DeprecationWarning',
]

# ---- ruff ----
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
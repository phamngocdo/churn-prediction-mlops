services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: minio server /mnt/data --console-address ":9001" --license /minio.license
    volumes:
      - ./license_keys/minio.license:/minio.license:ro
      - minio-data:/mnt/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [mlops-net]

  init-minio-bucket:
    image: amazon/aws-cli:2.17.62
    container_name: init-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "aws --endpoint-url http://minio:9000 s3 mb s3://${MINIO_DEFAULT_BUCKET} || true"
    networks: [mlops-net]

  postgres:
    image: postgres:16-alpine
    container_name: mlflow-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [mlops-net]

  mlflow:
    build:
      context: ./deployment/mlflow
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    env_file: .env
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:${MLFLOW_PORT},localhost,localhost:${MLFLOW_PORT},127.0.0.1,127.0.0.1:${MLFLOW_PORT}"
    command: >
      mlflow server
      --host 0.0.0.0
      --port ${MLFLOW_PORT}
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination s3://${MINIO_DEFAULT_BUCKET}
      --serve-artifacts
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      init-minio-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MLFLOW_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [mlops-net]

  train:
    build:
      context: .
      dockerfile: deployment/training/Dockerfile.train
    container_name: churn-train
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_API_TOKEN:-}
    volumes:
      - ./data:/app/data
    networks: [mlops-net]
    profiles: ["train"]

  api:
    build:
      context: .
      dockerfile: deployment/web/Dockerfile.api
    container_name: churn-api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
      MODEL_REGISTRY_NAME: ${MODEL_REGISTRY_NAME:-churn_model}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [mlops-net]

  web:
    build:
      context: .
      dockerfile: deployment/web/Dockerfile.web
    container_name: churn-web
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-8501}:8501"
    depends_on:
      - api
    networks: [mlops-net]

networks:
  mlops-net:

volumes:
  minio-data:
  postgres_data:
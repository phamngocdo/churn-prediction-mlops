services:
  garage:
    build:
      context: ./deployment/garage
      dockerfile: Dockerfile.garage
    container_name: garage
    env_file: .env
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
      S3_DVC_BUCKET: ${S3_DVC_BUCKET}
    volumes:
      - ./deployment/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # RPC
      - "3903:3903"   # Admin API
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [mlops-net]

  postgres:
    image: postgres:16-alpine
    container_name: mlflow-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [mlops-net] 

  mlflow:
    build:
      context: ./deployment/mlflow
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    env_file: .env
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${GARAGE_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${GARAGE_DEFAULT_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:${MLFLOW_PORT},localhost,localhost:${MLFLOW_PORT},127.0.0.1,127.0.0.1:${MLFLOW_PORT}"
    command: >
      mlflow server
      --host 0.0.0.0
      --port ${MLFLOW_PORT}
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination s3://${GARAGE_DEFAULT_BUCKET}
      --serve-artifacts
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MLFLOW_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [mlops-net] 

  train:
    build:
      context: .
      dockerfile: deployment/training/Dockerfile.train
    container_name: churn-train
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT} 
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_API_TOKEN:-}
    volumes:
      - ./data:/app/data
    networks: [mlops-net]
    profiles: ["train"]

networks:
  mlops-net:

volumes:
  garage_meta:
  garage_data:
  postgres_data: